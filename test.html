<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Distraction Free Study Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      display: flex;
      background-color: #f5f7fb;
      color: #333;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      height: 100vh;
      background: #111827;
      color: white;
      padding: 20px;
      position: fixed;
    }

    .sidebar h2 {
      margin-bottom: 30px;
      font-weight: 600;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar ul li {
      margin: 15px 0;
      cursor: pointer;
      opacity: 0.8;
      transition: 0.2s;
    }

    .sidebar ul li:hover {
      opacity: 100;
    }

    /* Main Content */
    .main {
      margin-left: 240px;
      padding: 30px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header input {
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      width: 250px;
      background: #e5e7eb;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .progress {
      height: 8px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      background: #6366f1;
      width: 60%;
    }

    /* Task List */
    .tasks {
      margin-top: 40px;
    }

    .task {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .task span {
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>📘 Distraction Free Study</h2>
    <ul>
      <li>Dashboard</li>
      <li>Subjects</li>
      <li>Tasks</li>
      <li>Notes</li>
      <li>Settings</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">

    <div class="header">
      <h1>Welcome back 👋</h1>
      <input type="text" placeholder="Search...">
    </div>


    <div class="tasks">
      <h2>Today's Tasks To Finish</h2>

      <div class="task">
        <div>Finish math homework</div>
        <span>Due 5 PM</span>
      </div>

      <div class="task">
        <div>Revise biology notes</div>
        <span>Due 7 PM</span>
      </div>

      <div class="task">
        <div>Read English chapter</div>
        <span>Due 9 PM</span>
      </div>

    </div>

  </div>

</body>
</html>
